<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bridge Bank — Connecting...</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #080b12; color: #e8edf5; }
    .wrap { text-align: center; }
    .spinner { width: 32px; height: 32px; border: 2px solid #1e2a40; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Completing bank connection...</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code  = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    // Extract Bridge Bank URL from state (format: "bridge-bank-auth|https://bb.example.com|uuid")
    function getBridgeBankUrl() {
      if (!state) return '';
      var parts = state.split('|');
      return parts.length > 1 ? parts[1] : '';
    }

    if (code && state && !error) {
      // Success — redirect to Bridge Bank's /callback
      const bridge_bank_url = getBridgeBankUrl() || 'http://localhost:3002';
      const callbackUrl = bridge_bank_url + '/callback?' + window.location.search.slice(1);
      window.location.href = callbackUrl;
      // If blocked (Safari HTTPS-Only), show manual instructions after 2 seconds
      setTimeout(function() {
        document.querySelector('.spinner').style.display = 'none';
        var isHttp = callbackUrl.startsWith('http://');
        var hint = isHttp
          ? '<br><br><span style="font-size:13px;color:#ef4444;">⚠ Your browser may block this because the URL is HTTP.<br>In Safari, go to <b>Settings → Privacy</b> and uncheck <b>"Upgrade to HTTPS"</b>, then click the button above.</span>'
          : '';
        document.querySelector('p').innerHTML = 'Click below to complete the connection:<br><br><a href="' + callbackUrl + '" style="background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block;">Complete connection →</a>' + hint + '<br><br><span style="font-size:12px;color:#4a5568;">Or paste this URL in a new tab:</span><br><code style="font-size:11px;color:#6366f1;word-break:break-all;cursor:pointer;" onclick="navigator.clipboard.writeText(\'' + callbackUrl + '\');this.style.color=\'#10b981\';this.textContent=\'Copied!\';setTimeout(function(){}.bind(this),1500)">' + callbackUrl + '</code>';
      }, 2000);
    } else {
      // Cancelled or error — redirect back to Bridge Bank
      var bbUrl = getBridgeBankUrl();
      if (bbUrl) {
        window.location.href = bbUrl + '/connect?error=auth_cancelled';
      } else {
        // No state available — show link back with fallback
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('p').innerHTML = 'Bank connection was cancelled or failed.<br><br><span style="font-size:13px;color:#94a3b8;">Use your browser\'s back button or return to Bridge Bank to try again.</span>';
      }
    }
  </script>
</body>
</html>
